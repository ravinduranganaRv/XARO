<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XARO admin password tool</title>
<style>
:root{--bg:#0b0f0c;--fg:#eef3ee;--mute:#9aa89a;--line:#243024;--neon:#39ff14;--card:#121812}
@media (prefers-color-scheme:light){:root{--bg:#f4f7f4;--fg:#101810;--mute:#566356;--line:#cdd8cd;--neon:#0a8a00;--card:#fff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font-size:24px;margin:0}p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
label{font-weight:600}input,textarea,button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
textarea{font:13px/1.4 ui-monospace,monospace;min-height:110px}button{cursor:pointer;background:var(--neon);color:#000;font-weight:700;border:0}
button.s{background:transparent;color:var(--fg);border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.ok{color:var(--neon)}
</style></head><body><main>
<h1>XARO admin password tool</h1>
<p>Runs only in this browser tab. Nothing is sent anywhere. The password is never shown to anyone else; only a scrambled version (hash) is produced.</p>
<div class="card">
  <label for="pw">New admin password (12+ characters, a long phrase is best)</label>
  <input id="pw" type="password" autocomplete="new-password">
  <label for="pw2">Type it again</label>
  <input id="pw2" type="password" autocomplete="new-password">
  <button id="go" type="button">Create</button><p id="msg" role="status"></p>
</div>
<div class="card" id="out" hidden>
  <label for="a">1. Paste this on the XARO site to use the new password in this browser now</label>
  <p>Open your XARO site, press F12, choose Console, paste this and press Enter, then reload and sign in as <b>Ravindu20007</b>.</p>
  <textarea id="a" readonly></textarea><button class="s" type="button" data-copy="a">Copy</button>
  <label for="b">2. Send this to Claude (it is safe to share, it is not your password)</label>
  <textarea id="b" readonly></textarea><button class="s" type="button" data-copy="b">Copy</button>
</div>
<script>
const $=id=>document.getElementById(id),hex=u=>[...u].map(b=>b.toString(16).padStart(2,'0')).join(''),ITER=310000;
async function mk(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const h=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},k,256);return{salt:hex(salt),hash:hex(new Uint8Array(h)),iter:ITER};}
$('go').onclick=async()=>{const m=$('msg');m.className='';
  if($('pw').value.length<12)return m.textContent='Use at least 12 characters.';if($('pw').value!==$('pw2').value)return m.textContent='The two passwords do not match.';
  m.textContent='Working...';const r=await mk($('pw').value);$('pw').value=$('pw2').value='';
  const seed=JSON.stringify(r);
  $('a').value="(()=>{const K='xaro.v2.admins',n="+seed+",l=JSON.parse(localStorage.getItem(K)||'[]'),p=['dashboard','customers','orders','products','pricing','assistant','settings','admins'];let o=l.find(x=>x.username==='Ravindu20007');if(!o){o={username:'Ravindu20007',name:'Ravindu',role:'owner',perms:p,active:true,at:new Date().toISOString(),last:''};l.unshift(o)}Object.assign(o,n,{active:true});localStorage.setItem(K,JSON.stringify(l));localStorage.removeItem('xaro.v2.lock');console.log('Done. Reload the page and sign in.')})()";
  $('b').value=seed;$('out').hidden=false;m.textContent='Done.';m.className='ok';};
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const t=$(b.dataset.copy);t.select();try{navigator.clipboard.writeText(t.value)}catch(x){document.execCommand('copy')}});
</script></main></body></html>
